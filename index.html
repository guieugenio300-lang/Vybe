<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>VYBE Social</title>
<style>
:root{--bg:#f4f2fb;--cd:#fff;--tx:#1a1633;--mu:#6b6788;--br:#e2def2;--ac:#6d4aff;--co:#ff5c7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#100d20;--cd:#1a1631;--tx:#efecfb;--mu:#9d98bb;--br:#2c2748;--ac:#8a6cff}}
:root[data-theme=dark]{--bg:#100d20;--cd:#1a1631;--tx:#efecfb;--mu:#9d98bb;--br:#2c2748;--ac:#8a6cff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding-bottom:76px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--cd);border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;max-width:640px;margin:auto}
.logo{font-weight:900;font-size:22px;letter-spacing:-1px;color:var(--ac)}.logo i{color:var(--co);font-style:normal}
main{max-width:640px;margin:auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--br);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav a,.ib{cursor:pointer;background:none;border:0;color:var(--mu);font-size:11px;text-align:center;padding:4px 8px;border-radius:10px;position:relative}
nav a b{display:block;height:26px}nav a.on{color:var(--ac)}.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-5px}.act .ic{width:19px;height:19px;vertical-align:-4px}.act .on .i-heart,.act .on .i-mark{fill:currentColor}.av .ic{width:56%;height:56%;stroke:#fff;vertical-align:0}.sw{width:34px;height:34px;border-radius:12px;border:2px solid transparent;cursor:pointer;color:var(--tx);display:grid;place-items:center;padding:0;background:var(--bg);font-weight:800;font-size:13px}.sw.wd{width:56px}.sw.on{border-color:var(--tx)}
.cd{background:var(--cd);border:1px solid var(--br);border-radius:18px;padding:14px;margin-bottom:12px}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:6px}.mu{color:var(--mu);font-size:13px}
.av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.av.big{width:72px;height:72px;font-size:28px;border-radius:22px}
a{color:var(--ac);cursor:pointer;text-decoration:none}
button.b{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}
button.b.g{background:none;color:var(--tx);border:1px solid var(--br)}button.b.r{background:var(--co)}
input,textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--br);border-radius:12px;padding:10px;font:inherit;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.act{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.act button{background:none;border:0;color:var(--mu);cursor:pointer;padding:6px 8px;border-radius:10px;font-size:14px}.act button.on{color:var(--co)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs a{padding:7px 14px;border-radius:99px;border:1px solid var(--br);color:var(--mu);white-space:nowrap;font-size:14px}.tabs a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.vb{width:16px;height:16px;vertical-align:-3px;margin-left:3px}
.bar{height:26px;border-radius:8px;background:var(--bg);position:relative;overflow:hidden;margin:4px 0;cursor:pointer}.bar i{position:absolute;inset:0 auto 0 0;background:var(--ac);opacity:.25}.bar span{position:relative;padding:0 10px;line-height:26px;font-size:14px}
.dot{background:var(--co);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;position:absolute;top:0;right:2px}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--br);text-align:left}
.me{background:var(--ac);color:#fff;border-radius:14px 14px 4px 14px;padding:8px 12px;margin:4px 0 4px auto;width:fit-content;max-width:80%}.ot{background:var(--bg);border-radius:14px 14px 14px 4px;padding:8px 12px;margin:4px 0;width:fit-content;max-width:80%}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:20;display:none}
@media(prefers-reduced-motion:no-preference){.cd{transition:border-color .2s}.cd:hover{border-color:var(--ac)}}
.eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.es{border-top:1px solid var(--br);padding:14px 0}.es h3{margin:0 0 10px;font-size:15px}.es label{display:block;margin-top:8px}.er{display:flex;gap:14px;align-items:center;margin-bottom:8px}.eb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}.cp{height:84px;border-radius:14px;margin-bottom:10px}.sr{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body><header><span class="logo" id="lg"></span><span id="top"></span></header><main id="app"></main><nav id="nv"></nav><div id="toast" role="status"></div><input type="file" id="fi" accept="image/png,image/jpeg,image/webp" hidden>
<script>
const $=s=>document.querySelector(s),id=()=>Math.random().toString(36).slice(2,10),now=()=>Date.now();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('vybe'))}catch(e){}
S=S||{users:[],posts:[],comms:[],dms:[],notifs:[],reports:[],audit:[],me:null,theme:'auto',cfg:{name:'VYBE',max:280,maint:false}};
const save=()=>{try{localStorage.setItem('vybe',JSON.stringify(S))}catch(e){toast('Armazenamento cheio. Remova algumas imagens.')}};
const U=i=>S.users.find(u=>u.id===i),M=()=>U(S.me);
const ago=t=>{const s=(now()-t)/1e3;return s<60?'agora':s<3600?Math.floor(s/60)+' min':s<86400?Math.floor(s/3600)+' h':Math.floor(s/86400)+' d'};
const hash=async p=>{try{return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('vybe:'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return 'x'+btoa(p)}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const stf=u=>u&&(u.role==='owner'||u.role==='mod'),own=u=>u&&u.role==='owner';
const stat=u=>{if(u.until&&u.until<now()){u.status='ok';u.until=0}if(u.mute&&u.mute.until&&u.mute.until<now())u.mute=null;return u.status};
const can=(u,k)=>{stat(u);return !(u.mute&&u.mute.k.includes(k))};
const log=(a,t,w)=>{S.audit.unshift({t:now(),by:S.me,a,tg:t,w:w||''});save()};
const nt=(to,x,k)=>{if(to!==S.me){S.notifs.unshift({id:id(),to,x,k:k||'',t:now(),r:0})}};
const VB='<svg class="vb" viewBox="0 0 24 24" aria-label="Verificado"><path d="M12 1.5l9 5v11l-9 5-9-5v-11z" fill="#6d4aff"/><path d="M7.5 12.3l3 3 6-6.3" stroke="#fff" stroke-width="2.4" fill="none"/></svg>';
const nm=u=>esc(u.name)+(u.verified?VB:'');
const IC={home:'M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z',search:'M11 4.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM16 16l4.5 4.5',group:'M9 11a3.2 3.2 0 100-6.4A3.2 3.2 0 009 11zM3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16.5 5a3 3 0 010 6M18 14.8c1.8.6 3 2.2 3 5.2',mail:'M3 6h18v12H3zM3 7l9 6.5L21 7',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4.5 20.5c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5',bell:'M6 17v-6a6 6 0 1112 0v6l1.5 2h-15zM10 21h4',gear:'M4 7h10M18 7h2M4 17h2M10 17h10M16 4v6M8 14v6',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',heart:'M12 20s-8-4.8-8-10.5A4.5 4.5 0 0112 7a4.5 4.5 0 018 2.5C20 15.2 12 20 12 20z',chat:'M4 5h16v11H9l-5 4z',repost:'M5 9V8a2 2 0 012-2h11l-3-3M19 15v1a2 2 0 01-2 2H6l3 3',mark:'M6 3h12v18l-6-4-6 4z',link:'M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1',edit:'M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4',trash:'M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13',pin:'M9 3h6l-1 6 3 3H7l3-3zM12 12v9',flag:'M5 21V4M5 5h12l-2 4 2 4H5',poll:'M5 20V10M12 20V4M19 20v-7'};
const ic=n=>IC[n]?`<svg class="ic i-${n}" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`:'';
const HUES=[262,340,170,28,200,310,95,0],COVS=[[262,320],[200,170],[20,340],[140,200],[300,230],[50,20]],SYMS=['','heart','bell','group','poll','pin','shield'];
const hue=u=>u.col!=null?HUES[u.col]:[...u.id].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360;
const gr=c=>`linear-gradient(120deg,hsl(${c[0]},65%,55%),hsl(${c[1]},70%,50%))`;
const ph=u=>u.photo&&u.photo.startsWith('data:image/'),cvi=u=>u.covImg&&u.covImg.startsWith('data:image/');
const av=(u,b)=>{const h=hue(u);return `<div class="av${b?' big':''}" style="${ph(u)?`background:#222 url(${u.photo}) center/cover`:`background:linear-gradient(135deg,hsl(${h},62%,56%),hsl(${(h+40)%360},62%,44%))`}" role="img" aria-label="Avatar de ${esc(u.name)}">${ph(u)?'':u.sym?ic(u.sym):esc(u.name[0]||'?').toUpperCase()}</div>`};
const pedit=u=>{const cv=cvi(u)?`url(${u.covImg}) center/cover`:gr(COVS[u.cov||0]);return `<div class="cd"><div class="eh"><b>Personalizar perfil</b><button class="b g" data-a="ped">Fechar</button></div>
<section class="es"><h3>Foto de perfil</h3><div class="er">${av(u,1)}<div class="eb"><button class="b" data-a="img" data-i="photo">${u.photo?'Trocar foto':'Enviar foto'}</button>${u.photo?'<button class="b g" data-a="imgx" data-i="photo">Remover</button>':''}</div></div><p class="mu">Sem foto, o avatar usa a cor e o símbolo abaixo.</p><div class="sr">${HUES.map((h,i)=>`<button class="sw ${u.col===i?'on':''}" style="background:hsl(${h},60%,52%)" data-a="pc" data-i="col:${i}" aria-label="Cor ${i+1}"></button>`).join('')}</div><div class="sr">${SYMS.map(s=>`<button class="sw ${(u.sym||'')===s?'on':''}" data-a="pc" data-i="sym:${s}" aria-label="Símbolo ${s||'inicial'}">${s?ic(s):'Aa'}</button>`).join('')}</div></section>
<section class="es"><h3>Capa</h3><div class="cp" style="background:${cv}"></div><div class="eb"><button class="b" data-a="img" data-i="cover">${u.covImg?'Trocar imagem':'Enviar imagem'}</button>${u.covImg?'<button class="b g" data-a="imgx" data-i="cover">Remover</button>':''}</div><p class="mu">Ou escolha um degradê:</p><div class="sr">${COVS.map((c,i)=>`<button class="sw wd ${(u.cov||0)===i?'on':''}" style="background:${gr(c)}" data-a="pc" data-i="cov:${i}" aria-label="Capa ${i+1}"></button>`).join('')}</div></section>
<section class="es"><h3>Informações</h3><label class="mu" for="pn">Nome de exibição</label><input id="pn" value="${esc(u.name)}" maxlength="40"><label class="mu" for="pb">Biografia</label><textarea id="pb" rows="2" maxlength="160">${esc(u.bio||'')}</textarea><label class="mu" for="pl">Link pessoal</label><input id="pl" value="${esc(u.link||'')}" placeholder="https://"></section>
<button class="b" style="width:100%;padding:12px" data-a="psave">Salvar alterações</button></div>`};
const fmt=t=>esc(t).replace(/#([\p{L}\d_]+)/gu,'<a data-a="tag" data-i="$1">#$1</a>').replace(/@([\w]+)/g,'<a data-a="hdl" data-i="$1">@$1</a>');
let v={p:'home',tab:'fy',arg:null,open:null,mode:'login',q:'',poll:false,adm:'dash',sv:false};
const go=(p,a)=>{v.p=p;v.arg=a||null;v.open=null;render();scrollTo(0,0)};
const vis=p=>{const a=U(p.uid),m=M();if(!a||p.del||stat(a)!=='ok')return 0;if(m&&(m.blocked||[]).includes(a.id))return 0;if(p.comm){const c=S.comms.find(c=>c.id===p.comm);if(c&&c.susp)return 0;if(c&&c.type!=='public'&&!(c.mem||[]).includes(S.me))return 0}if(a.priv&&a.id!==S.me&&!(m.follows||[]).includes(a.id))return 0;return 1};
const sc=p=>(p.likes.length+p.cm.length*2+p.rp.length*2+1)/(1+(now()-p.t)/216e5);
function postH(p,short){const a=U(p.uid),m=M(),c=p.comm&&S.comms.find(c=>c.id===p.comm);
const po=p.poll?p.poll.map((o,i)=>{const tot=p.poll.reduce((s,x)=>s+x.v.length,0);const pc=tot?Math.round(o.v.length/tot*100):0;return `<div class="bar" data-a="vote" data-i="${p.id}:${i}"><i style="width:${pc}%"></i><span>${esc(o.t)} ${tot?pc+'%':''}</span></div>`}).join(''):'';
const cms=v.open===p.id?`<div>${p.cm.filter(x=>!x.del).map(x=>{const u=U(x.uid);return u?`<p class="mu"><b>${nm(u)}</b> ${fmt(x.t)} ${stf(m)?`<a data-a="cdel" data-i="${p.id}:${x.id}">ocultar</a>`:''}</p>`:''}).join('')||'<p class="mu">Nenhum comentário ainda. Comece a conversa.</p>'}<div class="row"><input id="ci" placeholder="Escreva um comentário" aria-label="Comentário"><button class="b" data-a="cm" data-i="${p.id}">Comentar</button></div></div>`:'';
return `<article class="cd"><div class="hd">${av(a)}<div><b><a data-a="prof" data-i="${a.id}">${nm(a)}</a></b> <span class="mu">@${esc(a.handle)} · ${ago(p.t)}${p.edited?' · editado':''}${c?' · em '+esc(c.name):''}${a.pin===p.id?' · fixado':''}</span></div></div><p style="white-space:pre-wrap">${fmt(p.text)}</p>${p.q?`<div class="cd mu">${p.q}</div>`:''}${po}
<div class="act"><button class="${p.likes.includes(S.me)?'on':''}" data-a="like" data-i="${p.id}" aria-label="Curtir">${ic('heart')} ${p.likes.length}</button><button data-a="open" data-i="${p.id}" aria-label="Comentários">${ic('chat')} ${p.cm.filter(x=>!x.del).length}</button><button class="${p.rp.includes(S.me)?'on':''}" data-a="rp" data-i="${p.id}" aria-label="Republicar">${ic('repost')} ${p.rp.length}</button><button class="${(m.saved||[]).includes(p.id)?'on':''}" data-a="sv" data-i="${p.id}" aria-label="Salvar">${ic('mark')}</button><button data-a="link" data-i="${p.id}" aria-label="Copiar link">${ic('link')}</button>
${p.uid===S.me?`<button data-a="edit" data-i="${p.id}" aria-label="Editar">${ic('edit')}</button><button data-a="pdel" data-i="${p.id}" aria-label="Excluir">${ic('trash')}</button><button data-a="pin" data-i="${p.id}" aria-label="Fixar">${ic('pin')}</button>`:`<button data-a="rep" data-i="${p.id}" aria-label="Denunciar">${ic('flag')}</button>`}${stf(m)&&p.uid!==S.me?`<button data-a="pdel" data-i="${p.id}">${ic('shield')} remover</button>`:''}</div>${cms}</article>`}
const empty=t=>`<div class="cd mu" style="text-align:center">${t}</div>`;
function composer(comm){const m=M(),ok=can(m,'post');return `<div class="cd"><textarea id="tx" rows="2" maxlength="${S.cfg.max}" placeholder="${ok?'O que está rolando?':'Você está impedido de publicar'}" ${ok?'':'disabled'} aria-label="Nova publicação"></textarea>${v.poll?'<input id="o1" placeholder="Opção 1"><input id="o2" placeholder="Opção 2">':''}<div class="row"><button class="b g" data-a="tpoll">${ic('poll')} Enquete</button>${comm?'':`<select id="cm" style="width:auto"><option value="">Perfil público</option>${S.comms.filter(c=>(c.mem||[]).includes(S.me)&&!c.susp).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`}<span class="mu">máx. ${S.cfg.max}</span><button class="b" style="margin-left:auto" data-a="post" data-i="${comm||''}" ${ok?'':'disabled'}>Publicar</button></div></div>`}
function feed(list){return list.length?list.map(p=>postH(p)).join(''):empty('Nada por aqui ainda. Publique algo ou siga pessoas e comunidades.')}
const V={
auth(){const l=v.mode==='login';return `<div class="cd"><h1 style="margin:0;font-size:34px;letter-spacing:-2px"><span class="logo">${esc(S.cfg.name)}<i>.</i></span></h1><p>Ideias, comunidades e conversas em um só lugar.</p>${l?'':'<input id="n" placeholder="Nome de exibição"><input id="h" placeholder="Nome de usuário (sem @)">'}<input id="e" type="email" placeholder="E-mail"><input id="pw" type="password" placeholder="Senha (mínimo 8 caracteres)">${l?'':'<label class="mu"><input id="tm" type="checkbox" style="width:auto"> Aceito os termos de uso e a política de privacidade</label>'}<div class="row" style="margin-top:8px"><button class="b" data-a="${l?'login':'signup'}">${l?'Entrar':'Criar conta'}</button><button class="b g" data-a="mode">${l?'Criar conta':'Já tenho conta'}</button></div>${S.users.length?'':'<p class="mu">A primeira conta criada vira a proprietária da rede.</p>'}</div>`},
home(){const m=M();let L=S.posts.filter(vis);if(v.tab==='fl')L=L.filter(p=>p.uid===S.me||(m.follows||[]).includes(p.uid)||(p.comm&&(S.comms.find(c=>c.id===p.comm).mem||[]).includes(S.me))).sort((a,b)=>b.t-a.t);else L.sort((a,b)=>sc(b)-sc(a));
if(v.tab==='fy')L=L.filter(p=>p.uid!==S.me||1);
const tb=[['fy','Para você'],['fl','Seguindo'],['ex','Explorar']].map(([k,n])=>`<a class="${v.tab===k?'on':''}" data-a="tab" data-i="${k}">${n}</a>`).join('');
return composer()+`<div class="tabs">${tb}</div>`+feed(L.slice(0,30))},
search(){const q=v.q.toLowerCase().replace(/^[#@]/,'');let h='';const tags={};S.posts.filter(vis).forEach(p=>(p.text.match(/#[\p{L}\d_]+/gu)||[]).forEach(t=>tags[t.toLowerCase()]=(tags[t.toLowerCase()]||0)+1));
if(!q){const tr=Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,8);h=`<div class="cd"><b>Tendências</b><p class="mu">Calculadas a partir das hashtags usadas nesta rede, sem personalização.</p>${tr.map(([t,n])=>`<p><a data-a="tag" data-i="${t.slice(1)}">${esc(t)}</a> <span class="mu">${n} publicações</span></p>`).join('')||'<p class="mu">Ainda não há hashtags.</p>'}</div>`}
else{const us=S.users.filter(u=>stat(u)==='ok'&&(u.name+u.handle).toLowerCase().includes(q)),cs=S.comms.filter(c=>!c.susp&&c.type!=='private'&&c.name.toLowerCase().includes(q)),ps=S.posts.filter(vis).filter(p=>p.text.toLowerCase().includes(q));
h=us.map(u=>`<div class="cd hd">${av(u)}<a data-a="prof" data-i="${u.id}"><b>${nm(u)}</b> @${esc(u.handle)}</a></div>`).join('')+cs.map(c=>`<div class="cd"><a data-a="comm" data-i="${c.id}"><b>${esc(c.name)}</b></a> <span class="mu">comunidade</span></div>`).join('')+ps.map(p=>postH(p)).join('')||empty('Nenhum resultado. Tente outro termo.')}
return `<input id="q" value="${esc(v.q)}" placeholder="Buscar pessoas, posts, comunidades, #tags" aria-label="Buscar">${h}`},
comms(){return `<div class="cd"><b>Criar comunidade</b><input id="cn" placeholder="Nome"><input id="cd" placeholder="Descrição e regras"><select id="ct"><option value="public">Pública</option><option value="restricted">Restrita (todos veem, só membros postam)</option><option value="private">Privada (só membros veem)</option></select><button class="b" data-a="ccr">Criar</button></div>`+(S.comms.filter(c=>!c.susp&&(c.type!=='private'||(c.mem||[]).includes(S.me))).map(c=>`<div class="cd"><a data-a="comm" data-i="${c.id}"><b>${esc(c.name)}</b></a> <span class="mu">${c.type} · ${c.mem.length} membros</span><p>${esc(c.d)}</p><button class="b ${c.mem.includes(S.me)?'g':''}" data-a="join" data-i="${c.id}">${c.mem.includes(S.me)?'Sair':'Entrar'}</button></div>`).join('')||empty('Nenhuma comunidade. Crie a primeira.'))},

ban(i){const u=U(i);if(!own(M())||u.role==='owner')return toast('Sem permissão.');if(!confirm('Banir @'+u.handle+'?'))return;u.status='banned';u.until=0;u.why=prompt('Motivo')||'';log('Baniu','@'+u.handle,u.why);render()},
restore(i){const u=U(i);u.status='ok';u.until=0;u.mute=null;log('Restaurou conta','@'+u.handle);render()},
role(i){if(!own(M()))return;const u=U(i);if(u.role==='owner')return;u.role=u.role==='mod'?'user':'mod';log(u.role==='mod'?'Criou moderador':'Removeu moderador','@'+u.handle);render()},
rres(i){const r=S.reports.find(r=>r.id===i);r.s='resolvida';log('Denúncia resolvida',r.ty+' '+r.tid,prompt('Justificativa')||'');render()},
rrej(i){const r=S.reports.find(r=>r.id===i);r.s='rejeitada';log('Denúncia rejeitada',r.ty+' '+r.tid,prompt('Justificativa')||'');render()},
cfg(){if(!own(M()))return;S.cfg.name=val('cfn')||'VYBE';S.cfg.max=Math.max(20,Math.min(2000,+val('cfm')||280));S.cfg.maint=$('#cfx').checked;log('Configurações alteradas','global');toast('Configurações salvas');render()}};
function shrink(f,w,h,cb){if(!/^image\/(png|jpe?g|webp)$/.test(f.type))return toast('Use uma imagem PNG, JPG ou WebP.');if(f.size>8e6)return toast('A imagem passa de 8 MB.');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;x.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);cb(c.toDataURL('image/jpeg',.82))};im.onerror=()=>toast('Não foi possível ler a imagem.');im.src=r.result};r.onerror=()=>toast('Falha ao carregar a imagem.');r.readAsDataURL(f)}
A.img=i=>{A.psave(1);v.imgT=i;$('#fi').click()};
A.imgx=i=>{const m=M();if(i==='photo')delete m.photo;else delete m.covImg;render()};
const TY={public:'Pública',restricted:'Restrita',private:'Privada'};
const ccv=c=>c.img&&c.img.startsWith('data:image/')?`url(${c.img}) center/cover`:gr(COVS[c.cov||0]);
V.comms=()=>`<div class="cd"><b>Criar comunidade</b><input id="cn" maxlength="40" placeholder="Nome" aria-label="Nome da comunidade"><textarea id="cd" rows="2" maxlength="300" placeholder="Descrição e regras" aria-label="Descrição"></textarea><select id="ct" aria-label="Tipo"><option value="public">Pública: todos veem e participam</option><option value="restricted">Restrita: todos veem, só você publica</option><option value="private">Privada: só membros veem</option></select><button class="b" data-a="ccr">Criar</button></div>`+(S.comms.filter(c=>!c.susp&&(c.type!=='private'||c.mem.includes(S.me))).map(c=>`<div class="cd" style="padding:0;overflow:hidden"><div style="height:56px;background:${ccv(c)}"></div><div style="padding:12px 14px"><b>${esc(c.name)}</b> <span class="mu">${TY[c.type]} · ${c.mem.length} membros</span><p>${esc(c.d)}</p><div class="row"><button class="b" data-a="comm" data-i="${c.id}">Abrir</button><button class="b ${c.mem.includes(S.me)?'g':''}" data-a="join" data-i="${c.id}">${c.mem.includes(S.me)?'Sair':'Entrar'}</button></div></div></div>`).join('')||empty('Nenhuma comunidade ainda. Crie a primeira acima.'));
V.comm=()=>{const c=S.comms.find(c=>c.id===v.arg),m=M();if(!c||c.susp)return empty('Comunidade indisponível.')+'<button class="b g" data-a="go" data-i="comms">Voltar</button>';const mem=c.mem.includes(S.me),o=c.own===S.me,ow=U(c.own);if(c.type==='private'&&!mem&&!stf(m))return empty('Esta comunidade é privada.')+'<button class="b g" data-a="go" data-i="comms">Voltar</button>';const t=v.ct||'p';
const tabs=[['p','Publicações'],['m','Membros ('+c.mem.length+')']].map(([k,n])=>`<a class="${t===k?'on':''}" data-a="ctab" data-i="${k}">${n}</a>`).join('');
const head=`<div class="cd" style="overflow:hidden"><div style="height:96px;margin:-14px -14px 10px;background:${ccv(c)}"></div><h2 style="margin:0">${esc(c.name)}</h2><span class="mu">${TY[c.type]} · criada por ${ow?'@'+esc(ow.handle):'conta removida'}</span><p>${esc(c.d)||'Sem descrição.'}</p><div class="row"><button class="b g" data-a="go" data-i="comms">Voltar</button>${o?'':`<button class="b ${mem?'g':''}" data-a="join" data-i="${c.id}">${mem?'Sair':'Entrar'}</button>`}${o?`<button class="b g" data-a="img" data-i="ccover:${c.id}">Imagem de capa</button><button class="b g" data-a="cedit" data-i="${c.id}">Editar descrição</button><button class="b r" data-a="cdelc" data-i="${c.id}">Excluir</button>`:''}</div></div><div class="tabs">${tabs}</div>`;
if(t==='m')return head+c.mem.map(id=>U(id)).filter(Boolean).map(u=>`<div class="cd hd">${av(u)}<div><a data-a="prof" data-i="${u.id}"><b>${nm(u)}</b></a> <span class="mu">@${esc(u.handle)}${u.id===c.own?' · dono':''}</span></div>${o&&u.id!==S.me?`<button class="b g" style="margin-left:auto" data-a="crm" data-i="${c.id}:${u.id}">Remover</button>`:''}</div>`).join('');
const canp=mem&&(c.type!=='restricted'||o);return head+(canp?composer(c.id):mem?'<div class="cd mu">Nesta comunidade restrita só o dono publica.</div>':'<div class="cd mu">Entre na comunidade para publicar.</div>')+feed(S.posts.filter(p=>p.comm===c.id&&vis(p)).sort((a,b)=>b.t-a.t))};
A.comm=i=>{v.ct='p';go('comm',i)};A.ctab=i=>{v.ct=i;render()};
A.ccr=()=>{const n=val('cn');if(!n)return toast('Dê um nome à comunidade.');if(S.comms.some(c=>c.name.toLowerCase()===n.toLowerCase()))return toast('Já existe uma comunidade com esse nome.');const c={id:id(),name:n.slice(0,40),d:val('cd').slice(0,300),type:val('ct'),own:S.me,mem:[S.me],cov:Math.floor(Math.random()*6)};S.comms.push(c);toast('Comunidade criada');A.comm(c.id)};
A.cedit=i=>{const c=S.comms.find(c=>c.id===i);if(c.own!==S.me)return;const d=prompt('Descrição e regras',c.d);if(d!==null){c.d=d.slice(0,300);render()}};
A.cdelc=i=>{const c=S.comms.find(c=>c.id===i);if(c.own!==S.me||!confirm('Excluir a comunidade e todas as publicações dela?'))return;S.posts=S.posts.filter(p=>p.comm!==i);S.comms=S.comms.filter(x=>x!==c);go('comms')};
A.crm=i=>{const[c,u]=i.split(':'),C=S.comms.find(x=>x.id===c);if(C.own!==S.me||u===S.me)return;C.mem=C.mem.filter(x=>x!==u);nt(u,'Você foi removido de '+C.name);render()};
A.join=i=>{const c=S.comms.find(c=>c.id===i);if(c.own===S.me)return toast('O dono não pode sair da própria comunidade.');const k=c.mem.indexOf(S.me);k<0?(c.mem.push(S.me),toast('Você entrou')):(c.mem.splice(k,1),toast('Você saiu'));render()};
const SB={url:'https://vtbszvbpqwleyvafarho.supabase.co',key:'sb_publishable_GocRkxOvy_pUvFseqGkAZw_1S4ubPjr'};
const SH=['users','posts','comms','dms','notifs','reports','audit','cfg'];
const sbH=()=>{const o={apikey:SB.key,'Content-Type':'application/json'};if(SB.key.startsWith('eyJ'))o.Authorization='Bearer '+SB.key;return o};
const snap=()=>JSON.stringify(SH.map(k=>S[k]));
async function pull(){const r=await fetch(SB.url+'/rest/v1/vybe_state?id=eq.main&select=data',{headers:sbH(),cache:'no-store'});if(!r.ok)throw new Error('pull');const j=await r.json();if(j[0]&&j[0].data){const d=j[0].data;SH.forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});if(S.me&&!U(S.me))S.me=null}}
async function push(){const d={};SH.forEach(k=>d[k]=S[k]);const r=await fetch(SB.url+'/rest/v1/vybe_state',{method:'POST',headers:{...sbH(),Prefer:'resolution=merge-duplicates'},body:JSON.stringify({id:'main',data:d,updated:new Date().toISOString()})});if(!r.ok)throw new Error('push')}
let chain=Promise.resolve();
const sync=fn=>{if(!SB.url)return fn();return chain=chain.then(async()=>{let ok=1;try{await pull()}catch(e){ok=0;toast('Sem servidor: dados só neste aparelho.')}await fn();if(ok)try{await push()}catch(e){toast('Não foi possível salvar. Muitas imagens?')}})};
const UI=['mode','tab','open','tpoll','ped','ctab','go','img','link','mysv','comm','prof','chat','tag','hdl','adm'];
setInterval(()=>{if(!SB.url||document.hidden)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;chain=chain.then(async()=>{const b=snap();try{await pull()}catch(e){return}if(snap()!==b)render()})},8000);
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a]){e.preventDefault();const f=()=>A[t.dataset.a](t.dataset.i);UI.includes(t.dataset.a)?f():sync(f)}});
document.addEventListener('input',e=>{if(e.target.id==='q'){v.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}if(e.target.id==='uq'){v.uq=e.target.value;const p=e.target.selectionStart;render();const q=$('#uq');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='fi'){const f=e.target.files[0],t=v.imgT||'';e.target.value='';if(!f)return;const[k,c]=t.split(':'),p=k==='photo';shrink(f,p?256:900,p?256:300,d=>sync(()=>{if(p)M().photo=d;else if(k==='cover')M().covImg=d;else{const C=S.comms.find(x=>x.id===c);if(!C||C.own!==S.me)return;C.img=d}save();render();toast('Imagem atualizada')}))}if(e.target.id==='th'){S.theme=e.target.value;render()}if(e.target.id==='pv')sync(()=>{M().priv=e.target.checked;render()})});
render();if(SB.url)sync(()=>render());
</script></body></html>
